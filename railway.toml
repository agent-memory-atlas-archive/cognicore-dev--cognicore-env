[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "uvicorn cognicore.extension.remote:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*"
  healthcheckPath = "/health"
  healthcheckTimeout = 10
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
