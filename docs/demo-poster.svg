<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="CogniCore demo video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.45" stop-color="#151c3d"/>
      <stop offset="1" stop-color="#0c2b33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3b3fb8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b3fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#0f8f9c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f8f9c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="610" fill="url(#bg)"/>
  <rect width="1200" height="610" fill="url(#glow1)"/>
  <rect width="1200" height="610" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="609" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <circle cx="600" cy="248" r="64" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2"/>
  <polygon points="583,218 583,278 634,248" fill="#ffffff"/>

  <text x="600" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
